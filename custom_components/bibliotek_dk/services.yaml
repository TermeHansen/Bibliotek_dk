renew_all_loans:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bibliotek_dk

renew_loans:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bibliotek_dk
    loan_ids:
      required: true
      example: "1234567"
      selector:
        text:
          multiple: true

unlock:
  fields:
    encryption_passphrase:
      required: true
      selector:
        text:
          type: password
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: bibliotek_dk
