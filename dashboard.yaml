  - type: custom:auto-entities
    card:
      type: entities
      title: Biblioteksreserveringer til afhentning
    filter:
      template: "{% set data = namespace(books=[]) %}\n{%- set types = {'epub': \"\U0001F4DC\",\n
        \           'audiobook': '\U0001F3A7', 'podcast': '\U0001F399️',\n            'zip':
        \"\U0001F3A7\",\n            'bog': \"\U0001F4D6\",\n            'dvd': \"\U0001F4C0\",\n
        \           'billedbog': \"\U0001F9D2\",\n            'tegneserie': \"\U0001F4D5\"}
        -%}\n{% set libraryUsers = states.sensor\n  | selectattr('attributes.reservations_ready',
        'defined')\n  | rejectattr('attributes.address', 'defined')\n  | rejectattr('state',
        'eq', '0')\n  | map(attribute='entity_id')\n  | list %}\n{% for libraryUser
        in libraryUsers %}{% set USER = state_attr(libraryUser, 'user') %} {{\n   {\n
        \    'type': 'section',\n     'label': USER,\n   }\n  }}, {% set data.books
        = state_attr(libraryUser,'reservations_ready')%}{% set BOOKS = data.books|list
        %}{%- for book in BOOKS|sort(attribute='pickup_date') -%}\n   {%- set STATE
        = 'Afhent senest: ' ~ time_until(book.pickup_date)+' i '+book.pickup_library
        -%}\n   {%- set IMAGE = book.cover -%}\n   {%- set AUTHOR = book.creators
        -%}{{\n   {\n     'type': 'custom:template-entity-row',\n     'state': STATE,\n
        \    'name': (types.get(book.type, '\U0001F4D6')+book.title)|truncate(67,true,'…'),\n
        \    'secondary': AUTHOR,\n     'icon': 'mdi:book-open-page-variant',\n     'image':
        IMAGE,\n    }\n   }}, {%- endfor %}{% endfor %}"
    sort:
      reverse: false
    else:
      type: markdown
      title: Biblioteksreserveringer til afhentning
      content: |-
        {% set ns = namespace(count=0, unavailable=false) %}
        {% for sensor in expand(integration_entities('bibliotek_dk')) %}
          {% if sensor.attributes.reservations_ready is defined and sensor.attributes.address is not defined %}
            {% set ns.count = ns.count + 1 %}
            {% if not has_value(sensor.entity_id) %}{% set ns.unavailable = true %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ 'Biblioteksdata er midlertidigt utilgængelige.' if ns.unavailable or ns.count == 0 else 'Ingen reservationer klar til afhentning.' }}
  - type: custom:auto-entities
    card:
      type: entities
      title: Bibliotekslån
    filter:
      template: |-
        {% set ns = namespace(rows=[]) %}
        {% for sensor in expand(integration_entities('bibliotek_dk')) %}
          {% if sensor.attributes.loans is defined
                and sensor.attributes.address is not defined
                and has_value(sensor.entity_id) %}
            {% set loans = sensor.attributes.loans %}
            {% set entry_id = config_entry_id(sensor.entity_id) %}
            {% if loans and entry_id %}
              {% set ns.rows = ns.rows + [{
                'type': 'section', 'label': sensor.attributes.user
              }] %}
              {% set eligible = loans
                  | selectattr('renewable', 'equalto', true)
                  | rejectattr('renew_id', 'none') | list %}
              {% if eligible %}
                {% set ns.rows = ns.rows + [{
                  'type': 'button',
                  'name': 'Forny alle lån, der kan fornyes',
                  'action_name': 'Forny alle',
                  'icon': 'mdi:book-refresh',
                  'tap_action': {
                    'action': 'perform-action',
                    'perform_action': 'bibliotek_dk.renew_all_loans',
                    'data': {'config_entry_id': entry_id},
                    'confirmation': {
                      'text': 'Forny alle fysiske lån, som biblioteket tillader, for '
                        ~ sensor.attributes.user ~ '?'
                    }
                  }
                }] %}
              {% endif %}
              {% for book in loans %}
                {% set due = as_datetime(book.expire_date, none) %}
                {% set due_text = time_until(due) if due else 'Afleveringsdato ukendt' %}
                {% set can_renew = book.renewable == true and book.renew_id is not none %}
                {% set action = {
                  'action': 'perform-action',
                  'perform_action': 'bibliotek_dk.renew_loans',
                  'data': {'config_entry_id': entry_id, 'loan_ids': [book.renew_id]},
                  'confirmation': {'text': 'Forny ' ~ book.title ~ '?'}
                } if can_renew else {'action': 'none'} %}
                {% set ns.rows = ns.rows + [{
                  'type': 'custom:template-entity-row',
                  'entity': sensor.entity_id,
                  'name': book.title,
                  'secondary': (book.creators or '') ~ ' · ' ~ due_text,
                  'state': 'Forny' if can_renew else due_text,
                  'icon': 'mdi:book-refresh' if can_renew else 'mdi:book-open-page-variant',
                  'image': book.cover,
                  'tap_action': action
                }] %}
              {% endfor %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.rows }}
    else:
      type: markdown
      title: Bibliotekslån
      content: |-
        {% set ns = namespace(count=0, unavailable=false) %}
        {% for sensor in expand(integration_entities('bibliotek_dk')) %}
          {% if sensor.attributes.loans is defined and sensor.attributes.address is not defined %}
            {% set ns.count = ns.count + 1 %}
            {% if not has_value(sensor.entity_id) %}{% set ns.unavailable = true %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ 'Biblioteksdata er midlertidigt utilgængelige.' if ns.unavailable or ns.count == 0 else 'Ingen aktuelle lån.' }}
  type: masonry
