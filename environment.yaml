name: bibliotek_dk
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12
  - beautifulsoup4
  - pytest
  - pytest-asyncio
  - freezegun
  - python-dateutil
  - requests
  - ruff
  # config_flow imports voluptuous (HA bundles it at runtime); it only ships on
  # conda-forge, so the channel above is required for the tests to collect.
  - voluptuous
